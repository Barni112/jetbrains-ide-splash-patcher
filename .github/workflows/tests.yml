name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      TK_SCREENSHOT: test-artifacts/gui.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Tests including Tk GUI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests including Tk GUI (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}-${{ matrix.python }}
          path: test-artifacts/gui.png
          if-no-files-found: ignore
